name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  junit-tests:
    name: JUnit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JUNIT_JAR: .github/ci/junit-platform-console-standalone-1.10.0.jar
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile
        run: |
          mkdir -p "$RUNNER_TEMP/ci/classes"
          find src test/com -name '*.java' > "$RUNNER_TEMP/ci/sources.txt"
          javac -d "$RUNNER_TEMP/ci/classes" -cp "$JUNIT_JAR" @"$RUNNER_TEMP/ci/sources.txt"

      - name: Ensure virtual display is available
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Run JUnit tests
        run: xvfb-run -a java -jar "$JUNIT_JAR" execute --class-path "$RUNNER_TEMP/ci/classes" --select-package com.boutique --fail-if-no-tests --details=summary